<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>Spelling Bee — Word Spelling Game</title>
  <meta name="description"
    content="Swipe your way to spelling mastery. Fast, fun, addictive. Challenge your friends!" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1b1b1b" id="meta-theme-color" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spelling Bee" />

  <!-- Open Graph (social sharing) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Spelling Bee — Word Spelling Game" />
  <meta property="og:description"
    content="Swipe your way to spelling mastery. Fast, fun, addictive. Can you beat my streak? 🐝" />
  <meta property="og:image" content="/icon.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Spelling Bee — Word Spelling Game" />
  <meta name="twitter:description"
    content="Swipe your way to spelling mastery. Fast, fun, addictive. Can you beat my streak? 🐝" />

  <!-- SEO -->
  <link rel="canonical" href="https://spelling-bee-prod.web.app/" />
  <meta name="application-name" content="Spelling Bee" />
  <meta name="author" content="Google Antigravity" />
  <meta name="keywords" content="spelling app, spelling bee, spelling practice, learn to spell, spaced repetition spelling, spelling game for kids, vocabulary builder, phonics practice" />

  <!-- JSON-LD: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Spelling Bee",
    "alternateName": "Spell Bee",
    "url": "https://spelling-bee-prod.web.app",
    "description": "A spelling practice app that uses spaced repetition and adaptive difficulty to help learners master 117,000+ words across 10 difficulty levels. Swipe-based interface with daily challenges, leagues, and competition modes.",
    "applicationCategory": "EducationalApplication",
    "applicationSubCategory": "Spelling & Vocabulary",
    "operatingSystem": "Any (Progressive Web App)",
    "browserRequirements": "Requires a modern web browser with JavaScript enabled",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "audience": {
      "@type": "EducationalAudience",
      "educationalRole": "student",
      "suggestedMinAge": 6,
      "suggestedMaxAge": 18
    },
    "featureList": [
      "117,000+ words across 10 difficulty levels",
      "Spaced repetition with Leitner box system",
      "Adaptive difficulty based on answer speed",
      "Daily spelling challenges with global leaderboard",
      "Competition/bee simulation mode",
      "Swipe-based answer interface",
      "Offline support (PWA)",
      "Cloud sync across devices",
      "Weekly leagues and XP tracking",
      "Multiple question types: audio, definition, fill-in-blank, word origins"
    ],
    "screenshot": "https://spelling-bee-prod.web.app/icon-512.png",
    "softwareVersion": "1.0.4",
    "creator": {
      "@type": "Organization",
      "name": "Google Antigravity"
    }
  }
  </script>

  <!-- JSON-LD: FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "How does Spelling Bee help kids learn to spell?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Spelling Bee uses spaced repetition (Leitner box system) to schedule review of words at optimal intervals. Words you struggle with appear more often, while mastered words fade into longer review cycles. Adaptive difficulty adjusts within your level based on answer speed, keeping you in the learning sweet spot."
        }
      },
      {
        "@type": "Question",
        "name": "How many words does Spelling Bee have?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Over 117,000 words across 10 difficulty levels, from basic phonics words for early readers to advanced competition-level vocabulary. Every word includes a verified definition, real example sentence from published sources, pronunciation guide, and part of speech."
        }
      },
      {
        "@type": "Question",
        "name": "Is Spelling Bee free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, Spelling Bee is free to use. It works as a Progressive Web App (PWA) in any modern browser — no app store download required. It also works offline once installed."
        }
      },
      {
        "@type": "Question",
        "name": "What age group is Spelling Bee designed for?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Spelling Bee supports learners from age 6 through high school and beyond. Level 1 covers foundational words, while Levels 8-10 include advanced vocabulary suitable for spelling bee competition preparation. The adaptive difficulty system ensures each learner is challenged at the right level."
        }
      },
      {
        "@type": "Question",
        "name": "Can I use Spelling Bee to prepare for a spelling bee competition?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Spelling Bee includes a Competition mode that simulates real spelling bee rounds with progressive elimination, audio-only prompts, and no-help rules. Higher difficulty levels (8-10) focus on the kind of advanced vocabulary found in competitive spelling bees, including words with Latin, Greek, and French origins."
        }
      },
      {
        "@type": "Question",
        "name": "Does Spelling Bee work offline?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Spelling Bee is a Progressive Web App (PWA) that can be installed on your device and works fully offline. Your progress syncs to the cloud when you reconnect."
        }
      },
      {
        "@type": "Question",
        "name": "What makes Spelling Bee different from other spelling apps?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Spelling Bee combines scientifically-backed spaced repetition with a fast swipe-based interface, adaptive difficulty, and a massive curated word bank of 117,000+ words. Every example sentence is a real citation from published sources — never AI-generated. Daily challenges, weekly leagues, and competition modes keep learners motivated."
        }
      }
    ]
  }
  </script>

  <!-- Security: CSP locks down resource loading. unsafe-inline is required for style-src (Tailwind runtime).
       script-src uses a SHA-256 hash for the theme-detection inline script instead of unsafe-inline. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'sha256-PQ0xol2EBS+EDcvRu/7QdrdJh5jaNc2QBgaNs3ZfvYI=';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.cloudfunctions.net;
    img-src 'self' data:;
    media-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
  ">
</head>

<body>
  <!-- Prevent flash of wrong theme on load + set correct PWA theme-color -->
  <script>try { if (localStorage.getItem('spell-bee-theme') === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.getElementById('meta-theme-color')?.setAttribute('content', '#f5f0e8') } } catch (e) { }</script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
